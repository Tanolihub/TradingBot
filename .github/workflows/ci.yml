name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "0.1.39" # use appropriate version or remove for latest
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      working-directory: ./backend
      run: uv sync
    - name: Lint with ruff
      working-directory: ./backend
      run: uv run ruff check app/
    - name: Type check with mypy
      working-directory: ./backend
      run: uv run mypy app/
    - name: Test with pytest
      working-directory: ./backend
      run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
        cache-dependency-path: './frontend/pnpm-lock.yaml'
    - name: Install dependencies
      working-directory: ./frontend
      run: pnpm install
    - name: Lint
      working-directory: ./frontend
      run: pnpm eslint .
    - name: Type check
      working-directory: ./frontend
      run: pnpm tsc --noEmit
    - name: Test with Vitest
      working-directory: ./frontend
      run: pnpm vitest run
    # - name: Playwright smoke
    #   working-directory: ./frontend
