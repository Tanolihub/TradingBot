[project]
name = "neonpulse-backend"
version = "0.1.0"
description = "NeonPulse Trading Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "groq>=0.5.0",
    "sse-starlette>=2.0.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.5",
    "mypy>=1.9.0",
    "aiosqlite>=0.22.1",
    "pandas-stubs>=2.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001", "S110", "FURB162", "E402", "RUF100"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
